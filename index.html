function parseCSV(csv) {
    const lines = csv.trim().split('\n'), headers = lines[0].split(',').map(h => h.trim());
    return lines.slice(1).map(line => {
        const values = [], row = {}; let current = '', inQuotes = false;
        for (const char of line) { if (char === '"') inQuotes = !inQuotes; else if (char === ',' && !inQuotes) { values.push(current); current = ''; } else current += char; }
        values.push(current);
        headers.forEach((h, i) => row[h] = values[i]?.trim() || '');
        return row;
    }).filter(r => Object.values(r).some(v => v));
}

function renderGantt(data) {

    // Правильный подсчет завершенных этапов
    let completedStages = 0, currentStageNum = 0;
    for (let i = 1; i <= pile.stages; i++) {
        const start = pile['stage' + i + '_start'], end = pile['stage' + i + '_end'];
        if (start && end) completedStages++;
        else if (start && !end) currentStageNum = i;
    }
    if (completedStages === pile.stages) currentStageNum = pile.stages;
    else if (currentStageNum === 0 && completedStages > 0) currentStageNum = completedStages;
    // Генерация списка этапов
    let stagesHtml = '<div class="stages-list">';
    for (let i = 1; i <= pile.stages; i++) {
        const start = pile['stage' + i + '_start'], end = pile['stage' + i + '_end'];
        let ss = 'not-started', dates = t('notStartedStatus');
        if (start && end) { ss = 'complete'; dates = formatDate(start) + ' - ' + formatDate(end); }
        else if (start) { ss = 'ongoing'; dates = formatDate(start) + ' - ' + t('inProgressStatus'); }
        stagesHtml += '<div class="stage-item"><div class="indicator ' + ss + '"></div><div class="info"><div class="name">' + t('stage') + ' ' + i + ' (' + t('cell') + ' ' + i + ')</div><div class="dates">' + dates + '</div></div></div>';
    }
    stagesHtml += '</div>';
    const op = openingData.find(o => o.pile_id === pile.id);
    let oh = '';
    if (op) {
        oh = '<div class="modal-section"><h3>' + t('cellData') + ' (' + t('cell') + ' ' + op.cell_number + ')</h3><table class="cell-table"><thead><tr><th>' + t('sensor') + '</th><th>' + op.level_upper + '</th><th>' + op.level_lower + '</th><th>' + t('netOpening') + '</th></tr></thead><tbody><tr><td>A</td><td class="cell-value positive">' + op.cell_a_upper.toFixed(2) + '</td><td class="cell-value negative">' + op.cell_a_lower.toFixed(2) + '</td><td style="color:#60a5fa;font-weight:600">' + op.net_a.toFixed(2) + '</td></tr><tr><td>B</td><td class="cell-value positive">' + op.cell_b_upper.toFixed(2) + '</td><td class="cell-value negative">' + op.cell_b_lower.toFixed(2) + '</td><td style="color:#60a5fa;font-weight:600">' + op.net_b.toFixed(2) + '</td></tr><tr><td>C</td><td class="cell-value positive">' + op.cell_c_upper.toFixed(2) + '</td><td class="cell-value negative">' + op.cell_c_lower.toFixed(2) + '</td><td style="color:#60a5fa;font-weight:600">' + op.net_c.toFixed(2) + '</td></tr></tbody></table><div style="margin-top:15px;padding:15px;background:rgba(59,130,246,0.1);border-radius:8px;text-align:center"><div style="font-size:12px;color:#9ca3af">' + t('maxOpening') + '</div><div style="font-size:28px;font-weight:bold;color:#4ade80">' + op.max_net.toFixed(2) + ' mm</div></div></div>';
    }
    document.getElementById('modal-content').innerHTML = '<div class="modal-section"><h3>' + t('pileInfo') + '</h3><div class="modal-grid"><div class="modal-item"><div class="label">' + t('status') + '</div><div class="value ' + sc + '">' + st + '</div></div><div class="modal-item"><div class="label">' + t('readiness') + '</div><div class="value blue">' + pile.readiness + '%</div></div><div class="modal-item"><div class="label">' + t('currentStage') + '</div><div class="value yellow">' + completedStages + ' / ' + pile.stages + '</div></div></div></div><div class="modal-section"><h3>' + t('stagesProgress') + '</h3>' + stagesHtml + '</div>' + oh;
    document.getElementById('pile-modal').classList.add('active');
}
function closeModal() { document.getElementById('pile-modal').classList.remove('active'); }
document.getElementById('pile-modal').addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function switchToPage(pageId) {
    if (charts.areaProgress) { charts.areaProgress.destroy(); charts.areaProgress = null; }
    if (charts.statusPie) { charts.statusPie.destroy(); charts.statusPie = null; }
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelector('[data-page="' + pageId + '"]').classList.add('active');
    document.getElementById(pageId).classList.add('active');
    if (pageId === 'overview' && pilesData.length) {
        const stats = { total: pilesData.length, complete: pilesData.filter(p => p.status === 'Complete').length, ongoing: pilesData.filter(p => p.status === 'Ongoing').length, notStarted: pilesData.filter(p => p.status === 'Not Started').length, avgReadiness: Math.round(pilesData.reduce((s, p) => s + p.readiness, 0) / pilesData.length) };
        renderOverview(stats);
    }
}
document.querySelectorAll('.nav-tab').forEach(tab => tab.addEventListener('click', () => switchToPage(tab.dataset.page)));
updateTranslations();
loadData();
initAutoRefresh();
</script>
</body>
</html>
